[package]
name = "tcpserver"
version = "0.1.0"
edition = "2021"

[dependencies]
crypto = { path = "../crypto" }
common = {path = "../common"}
tokio = { version = "1", features = ["full"] }
anyhow = "1.0.99"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.144"
tracing = "0.1.41"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10.0-rc.0"
thiserror = "2.0.16"
clap = { version = "4.5.47", features = ["derive"] }